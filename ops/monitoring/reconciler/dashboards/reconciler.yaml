# One-page reconciler dashboard. Operators view this while
# investigating any of the alert policies in ../alerts/.
#
# Layout: 6 tiles in a 2×3 grid. Freshness heartbeat top-left;
# overdue metrics side-by-side; per-outcome and per-reason
# breakdowns below.
displayName: "Room Reconciler — Track 1"
labels:
  managed_by: reconciler-monitoring
  resource_id: reconciler_dashboard
mosaicLayout:
  columns: 12
  tiles:
    - width: 6
      height: 4
      widget:
        # ALIGN_SUM per minute gives "successful ticks per minute"
        # directly. ALIGN_RATE would emit per-second values and
        # mislabel the chart.
        title: Freshness heartbeat — successful ticks per minute
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_success_ticks"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_SUM
                    crossSeriesReducer: REDUCE_SUM
              plotType: LINE
    - xPos: 6
      width: 6
      height: 4
      widget:
        title: Tick outcomes per minute — grouped by outcome
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_tick_outcomes"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_SUM
                    crossSeriesReducer: REDUCE_SUM
                    groupByFields:
                      - "metric.label.outcome"
              plotType: STACKED_BAR
    - yPos: 4
      width: 6
      height: 4
      widget:
        title: Overdue ticks — count per minute
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_overdue_ticks"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_SUM
                    crossSeriesReducer: REDUCE_SUM
              plotType: LINE
    - yPos: 4
      xPos: 6
      width: 6
      height: 4
      widget:
        # Three overlaid series (p50/p95/p99) so the chart matches
        # its label — a single p95 line was misleading given the
        # metric description promises full distribution visibility.
        title: Oldest overdue cleanup — p50 / p95 / p99
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_oldest_overdue_seconds"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_50
                    crossSeriesReducer: REDUCE_MAX
              plotType: LINE
              legendTemplate: p50
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_oldest_overdue_seconds"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_95
                    crossSeriesReducer: REDUCE_MAX
              plotType: LINE
              legendTemplate: p95
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_oldest_overdue_seconds"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_PERCENTILE_99
                    crossSeriesReducer: REDUCE_MAX
              plotType: LINE
              legendTemplate: p99
    - yPos: 8
      width: 6
      height: 4
      widget:
        title: Recovery actions per minute — grouped by reason
        xyChart:
          dataSets:
            - timeSeriesQuery:
                timeSeriesFilter:
                  filter: |-
                    resource.type="cloud_run_revision"
                    AND metric.type="logging.googleapis.com/user/reconciler_actions"
                  aggregation:
                    alignmentPeriod: 60s
                    perSeriesAligner: ALIGN_SUM
                    crossSeriesReducer: REDUCE_SUM
                    groupByFields:
                      - "metric.label.reason"
              plotType: STACKED_BAR
    - yPos: 8
      xPos: 6
      width: 6
      height: 4
      widget:
        # Recent reconciler events: ticks + cleanup_started /
        # cleanup_finished diagnostics. An in-progress cleanup is
        # visible as an unmatched `cleanup_started` (no
        # `cleanup_finished` with the same org_id / room_id follows)
        # — the tick payload cannot surface this because it emits
        # only after cleanup returns.
        title: Recent reconciler events (ticks + cleanup lifecycle)
        logsPanel:
          # Scoped to the same Cloud Run service the metrics are —
          # the __CLOUD_RUN_SERVICE__ placeholder is substituted at
          # apply time. Without it the panel would show events from
          # every service in the project.
          filter: |-
            resource.type="cloud_run_revision"
            AND resource.labels.service_name="__CLOUD_RUN_SERVICE__"
            AND jsonPayload.component="room_reconciler"
            AND (jsonPayload.event="reconciler_tick"
                 OR (jsonPayload.event="reconciler_diagnostic"
                     AND (jsonPayload.kind="cleanup_started"
                          OR jsonPayload.kind="cleanup_finished")))
