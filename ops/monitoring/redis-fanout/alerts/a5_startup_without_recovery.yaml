# Alert A5 — a startup failure that never recovered.
#
# PromQL query joins the two series on (revision_name,
# instance_id) via `unless`, so the alert fires only when the
# left side (startup_failed) has a per-instance vector element
# for which the right side (reconnect_successes) does NOT.
# This survives the "never-emitted" trap that a bare
# conditionAbsent has (`unless` returns the left element when
# the right series is entirely absent, not just when it's
# zero) — the failure mode the reviewer flagged in round 1.
#
# Managed identity: userLabels.managed_by=ops-monitoring-redis-fanout
# + userLabels.alert_id=a5-startup-without-recovery. Runbook URL
# lives in the documentation markdown because Cloud Monitoring
# rejects userLabels values containing '/', '.', '#' or other
# non-[a-z0-9_-] characters.
#
# Manifest anchor: alerts.a5_startup_without_recovery
displayName: "[Redis fanout] A5 startup-failed without recovery (per instance)"
combiner: OR
enabled: true
userLabels:
  managed_by: ops-monitoring-redis-fanout
  alert_id: a5-startup-without-recovery
  runbook: redis-fanout-alerts
documentation:
  mimeType: text/markdown
  content: |
    ## A5 — Redis pubsub startup failed and adapter did not recover

    An instance emitted `redis_pubsub_initial_connect_failed`
    within a 5-minute window and has NOT emitted
    `redis_pubsub_reconnected` on the same instance in the
    same window.

    Runbook: see `docs/03-analysis/redis-fanout-rollout-proposal.md#alerts`
    in the deepgram repo for the diagnostic sequence. Do NOT
    silently roll back — a rollback reintroduces the
    local-only-broadcast fallback that A5-legacy alerts on.
conditions:
  - displayName: startup_failed AND no reconnect_successes (per instance, 5 min)
    conditionPrometheusQueryLanguage:
      query: |
        (
          sum by (revision_name, instance_id) (
            increase(logging_googleapis_com:user_redis_pubsub_startup_failed[5m])
          ) > 0
        )
        unless on (revision_name, instance_id)
        (
          sum by (revision_name, instance_id) (
            increase(logging_googleapis_com:user_redis_pubsub_reconnect_successes[5m])
          ) > 0
        )
      duration: 60s
      evaluationInterval: 60s
notificationChannels: []
alertStrategy:
  autoClose: 604800s
