# Log-based metric — the reader loop successfully repaired a
# broken subscriber. This is the RECOVERY signal that A5 uses
# to prove the adapter self-healed after a startup failure, and
# that A6 uses to distinguish a stuck reconnect-loop from a
# repaired one.
#
# Manifest anchor: metrics.redis_pubsub_reconnect_successes
name: redis_pubsub_reconnect_successes
description: |
  redis pubsub reader loop reconnected and re-subscribed
  successfully. Managed by ops/monitoring/redis-fanout — do NOT
  edit in the Cloud Console.
filter: |
  resource.type="cloud_run_revision"
  resource.labels.service_name="worshiptranslate-backend"
  jsonPayload.event="redis_pubsub_reconnected"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: instance_id
      valueType: STRING
      description: Adapter INSTANCE_ID.
labelExtractors:
  instance_id: EXTRACT(jsonPayload.instance_id)
