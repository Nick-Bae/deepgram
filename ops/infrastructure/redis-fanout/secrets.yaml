# Secret Manager bindings required for the Redis pub/sub
# rollout. cloudrun.yaml references
# `secrets.redis_password.secretKeyRef` — validate.py rejects
# any Cloud Run env whose name is `REDIS_PASSWORD` and whose
# `kind` differs from `secret_or_absent`.
#
# Manifest anchor: secrets
apiVersion: secrets/v1
kind: SecretBindings
metadata: {}
spec:
  redis_password:
    # When Memorystore's `auth_enabled: true` is chosen in
    # memorystore.yaml, this secret MUST be present and bound.
    # When `auth_enabled: false` is chosen, this whole block
    # sets `present: false` — validate.py refuses the
    # mismatched pair.
    present: true
    secret_name: redis-password
    # `latest` is intentional — the operator rotates the value
    # via Secret Manager without redeploying Cloud Run. A pinned
    # version would silently pin the credential to a rotation
    # ago.
    version: latest
    # secretKeyRef shape the Cloud Run env consumes.
    secret_key_ref:
      name: redis-password
      key: latest
