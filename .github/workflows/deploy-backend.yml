name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.CLOUD_RUN_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --platform managed \
            --min-instances=1 \
            --max-instances=1 \
            --concurrency=80 \
            --cpu=1 \
            --memory=1Gi \
            --timeout=3600 \
            --cpu-boost \
            --quiet

      - name: Route 100% traffic to the newly deployed revision
        run: |
          # Cloud Run preserves the previous traffic-split pattern across
          # deploys. If a tagged / no-traffic revision was ever deployed
          # (e.g. the temporary deploy-pr16-test.yml workflow), a plain
          # `gcloud run deploy` here would create a new revision but LEAVE
          # normal traffic on the older production revision. --to-latest
          # explicitly shifts 100% of untagged traffic to the revision this
          # workflow just built, restoring the expected prod behavior.
          gcloud run services update-traffic ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --to-latest \
            --quiet
