name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.CLOUD_RUN_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          # Explicit env-var overrides make production configuration
          # reproducible instead of relying on whatever the service template
          # happens to hold:
          #   * REDIS_ENABLED=0 — the Memorystore Redis instance this project
          #     claims to use does not currently exist. Prod is safe only
          #     because it runs single-instance (--max-instances=1) and the
          #     code falls back to local delivery when Redis is unreachable.
          #     Keep this at 0 until Memorystore is provisioned AND the
          #     two-instance cross-instance test has passed on a tagged
          #     revision. Do not flip to 1 without that verification.
          #   * ROOM_RECONCILER_ENABLED=0 — PR-T1-C ships the Firestore
          #     reconciler dark. Enable only after F-8/F-24 are green and the
          #     production dark-metric baseline has been reviewed.
          #   * CORS_ALLOW_ORIGINS pinned to the four production hostnames.
          #     The temporary PR #16 test workflow appended a Vercel preview
          #     origin; this line restores the prod-only baseline every deploy
          #     so no accidental widening survives.
          # ^|^ alternate delimiter — the CORS value contains commas as origin
          # separators, so we can't use the default comma pair-separator.
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --platform managed \
            --min-instances=1 \
            --max-instances=1 \
            --concurrency=80 \
            --cpu=1 \
            --memory=1Gi \
            --timeout=3600 \
            --cpu-boost \
            --update-env-vars="^|^REDIS_ENABLED=0|ROOM_RECONCILER_ENABLED=0|CORS_ALLOW_ORIGINS=https://www.worshiptranslate.com,https://worshiptranslate.com,https://www.worshiptranslation.com,https://worshiptranslation.com" \
            --quiet

      - name: Route 100% traffic to the newly deployed revision
        run: |
          # Cloud Run preserves the previous traffic-split pattern across
          # deploys. If a tagged / no-traffic revision was ever deployed
          # (e.g. the temporary deploy-pr16-test.yml workflow), a plain
          # `gcloud run deploy` here would create a new revision but LEAVE
          # normal traffic on the older production revision. --to-latest
          # explicitly shifts 100% of untagged traffic to the revision this
          # workflow just built, restoring the expected prod behavior.
          gcloud run services update-traffic ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --to-latest \
            --quiet
